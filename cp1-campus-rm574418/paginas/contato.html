    <header>

        <nav>

                <li> <a href="./atividade.html">Atividade</a> </li>
            </ul>
        </nav>

    </header>

    <main>
       
        <section>
            <h2>Fale com a equipe</h2>
            <form>
                <fieldset>
                    <legend> Preencha os campos para registrar seu nome, seu e-mail e sua mensagem</legend>
                    <div>
                        <label for="nome">Nome:</label>
                        <input type="text" name="nome" id="nome" placeholder="Digite seu nome" size="50" required>
                    </div>
                    <div>
                        <label for="email">E-mail:</label>
                        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" size="50" required>
                    </div>
                    <div>
                        <label for="mensagem">Mensagem:</label>
                        <textarea name="mensagem" id="mensagem" placeholder="Digite sua mensagem"></textarea>
                    </div>
                    <div>
                        <input type="submit" id="enviar" value="Enviar">
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
